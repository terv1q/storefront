# The server block of the storefront image.
#
# One container answers both halves of the deployment: the built application as
# files, and the API and its uploaded photographs as one reverse-proxied path
# each. That is deliberate rather than convenient — the browser reaches the API
# on the same origin it loaded the page from, so the session token travels in an
# `Authorization` header with no cross-origin request in the way, and CORS never
# has to be widened to make the storefront work.
#
# The cache rules are the point of the file. Vite writes every asset into
# `/assets/` under a name that contains a hash of its contents, so a file at a
# given address never changes and can be cached for a year; `index.html` is the
# file that names those hashes, so it must never be cached at all, or a browser
# would keep loading yesterday's asset names. The API's own answers carry their
# caching from the server, which is why the proxy does not add any.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Review photographs are uploaded as multipart bodies of up to four images
    # of five megabytes each. The default limit is one megabyte, which would
    # reject a single photograph before the API ever saw the request.
    client_max_body_size 25m;

    # Headers the API cannot set for the pages it does not serve. They repeat
    # the ones helmet puts on an API response, because a document is answered by
    # nginx and never reaches the API at all.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression for the text this container serves itself. An asset is already
    # compressed once by the build where it can be; JSON from the API arrives
    # compressed and is passed through untouched.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Content-hashed assets: the name changes when the content does, so the
    # response can be cached for as long as a browser will keep it.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Brand files and photographs are replaced rarely and keep their names, so
    # they get a short cache with a revalidating tail rather than a long one.
    location /brand/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The document that names the hashed assets. A cached copy is a page that
    # asks for files which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # The API. `proxy_pass` without a trailing path passes the request URI
    # through unchanged, so `/api/products` reaches the server as itself.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # The sitemap. It is generated by the API from the catalog as it stands, so
    # it comes from the same place the products do rather than from a file in
    # the image that could only ever be a snapshot of the seed.
    location = /sitemap.xml {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # `robots.txt` too: it names the origin and the sitemap's address, and only
    # the API knows what the deployment is served from.
    location = /robots.txt {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Uploaded review photographs, served by the API from its own volume.
    location /uploads/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Everything else is the single-page application: a real file if there is
    # one, and the document otherwise, so that a deep link like `/orders/…`
    # reopens the page that reads the path rather than answering 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
